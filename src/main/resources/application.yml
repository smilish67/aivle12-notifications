server:
  port: 8088

spring:
  application:
    name: notifications

  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true
        trace: false

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        implicit_naming_strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyComponentPathImpl

  cloud:
    stream:
      kafka:
        binder:
          brokers: localhost:9092
        streams:
          binder:
            configuration:
              default:
                key:
                  serde: org.apache.kafka.common.serialization.Serdes$StringSerde
                value:
                  serde: org.apache.kafka.common.serialization.Serdes$StringSerde
      bindings:
        # 구독할 토픽들 (Consumer)
        author-review-in:
          group: notifications
          destination: author.review.v1
          contentType: application/json
        book-published-in:
          group: notifications
          destination: book.published.v1
          contentType: application/json

# Authors 서비스 URL 설정
authors:
  service:
    url: ${AUTHORS_SERVICE_URL:http://localhost:8089}

logging:
  level:
    org.hibernate.type: trace
    org.springframework.cloud: debug

---

# Docker 환경 설정
spring:
  profiles: docker
  cloud:
    stream:
      kafka:
        binder:
          brokers: my-kafka:9092
        streams:
          binder:
            configuration:
              default:
                key:
                  serde: org.apache.kafka.common.serialization.Serdes$StringSerde
                value:
                  serde: org.apache.kafka.common.serialization.Serdes$StringSerde
      bindings:
        # 구독할 토픽들 (Consumer)
        author-review-in:
          group: notifications
          destination: author.review.v1
          contentType: application/json
        book-published-in:
          group: notifications
          destination: book.published.v1
          contentType: application/json

# Docker 환경의 Authors 서비스 URL 설정
authors:
  service:
    url: http://gateway:8089
